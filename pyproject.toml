[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "el-rouji-mcp"
version = "0.1.0"
description = "Guarded local MCP adapter for the EL-Rouji application API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=2.0.0,<3",
]

[project.scripts]
el-rouji-mcp = "el_rouji_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
